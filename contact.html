<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dream Travels - Contact</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h1>✈ Dream Travels</h1>

    <nav>
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
    </nav>
</header>

<main>

    <section class="content">
        <h2>Contact Us</h2>

        <p>Have a question or want to plan your next trip?</p>

        <form>

            <label for="name">Name:</label>
            <input type="text" id="name" name="name" placeholder="Enter your name">

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" placeholder="Enter your email">

            <label for="destination">Destination:</label>
            <input type="text" id="destination" name="destination" placeholder="Where do you want to go?">

            <label for="message">Message:</label>
            <textarea id="message" name="message" rows="5" placeholder="Write your message"></textarea>

            <button type="submit">Send Message</button>

        </form>
    </section>

</main>

<footer>
    <p>&copy; 2026 Dream Travels. All Rights Reserved.</p>
</footer>

</body>
</html>
